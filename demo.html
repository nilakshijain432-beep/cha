<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasturi Perfume – website demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; font-family: "Jost", system-ui, sans-serif; color: #f1ead8;
           background: radial-gradient(ellipse at 50% 0%, #2b2d30, #17181a 70%); }
    .hero { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px; }
    .hero img { width: min(260px, 60vw); margin: 0 auto 18px; }
    .hero p { color: #a39d8c; max-width: 36ch; margin: 0 auto; line-height: 1.6; }

    /* ---- the chat launcher: copy this block into your real website ---- */
    #kp-launch { position: fixed; right: 20px; bottom: 20px; z-index: 9999; width: 64px; height: 64px; border-radius: 50%;
                 border: 1px solid rgba(217,180,74,.5); background: #1d1f21; cursor: pointer; display: grid; place-items: center;
                 box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    #kp-launch img { width: 40px; height: 34px; object-fit: contain; }
    #kp-frame { position: fixed; right: 20px; bottom: 96px; z-index: 9999; width: 400px; height: min(640px, calc(100dvh - 120px));
                border: 1px solid rgba(217,180,74,.3); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); display: none; background: #1d1f21; }
    #kp-frame.open { display: block; }
    @media (max-width: 520px) {
      #kp-frame { right: 0; bottom: 0; width: 100%; height: 100dvh; border-radius: 0; border: 0; }
      #kp-frame.open ~ #kp-launch { display: none; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <img src="/static/logo-full.png" alt="Kasturi Perfume">
    <p>This page stands in for your website. Use the gold button at the bottom right to open the assistant.</p>
  </section>

  <iframe id="kp-frame" title="Kasturi Perfume chat" loading="lazy"></iframe>
  <button id="kp-launch" type="button" aria-label="Open chat"><img src="/static/logo-emblem.png" alt=""></button>

  <script>
    const frame = document.getElementById("kp-frame");
    window.addEventListener("message", (e) => { if (e.data === "kasturi-chat-close") frame.classList.remove("open"); });
    document.getElementById("kp-launch").addEventListener("click", () => {
      if (!frame.src) frame.src = "/";          // on your real site: your chatbot's full address
      frame.classList.toggle("open");
    });
  </script>
</body>
</html>
