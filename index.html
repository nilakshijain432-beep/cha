<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasturi Perfume – Chat</title>
  <link rel="icon" type="image/png" href="/static/logo-emblem.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Jost:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="chat" aria-label="Kasturi Perfume chat">

    <header class="chat__head">
      <img class="chat__mark" src="/static/logo-emblem.png" alt="">
      <div class="chat__title">
        <strong>Kasturi Perfume</strong>
        <span>Fragrance assistant</span>
      </div>
      <button class="chat__restart" id="restart" type="button">New chat</button>
      <button class="chat__close" id="close" type="button" aria-label="Close chat" hidden>&#10005;</button>
    </header>

    <section class="chat__log" id="log" aria-live="polite">
      <div class="crest" id="crest">
        <img src="/static/logo-full.png" alt="Kasturi Perfume">
        <p>Capture the essence. Wear elegance.</p>
      </div>
    </section>

    <footer class="chat__foot">
      <div class="chips" id="chips" hidden></div>
      <form class="composer" id="composer" autocomplete="off">
        <input id="field" type="text" maxlength="200" placeholder="Connecting…" aria-label="Your message" disabled>
        <button id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 11.5 20 4l-4.5 16-3.6-6.4L3 11.5Z" fill="currentColor"/></svg>
        </button>
      </form>
      <p class="hint" id="hint" role="alert"></p>
      <button class="again" id="again" type="button" hidden>Start a new chat</button>
    </footer>

  </main>
  <script src="/static/app.js"></script>
</body>
</html>
